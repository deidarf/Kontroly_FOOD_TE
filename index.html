<script>
"use strict";
/* Kontroly zásob — client-side app (no backend). Data lives in localStorage; PDFs are built in the browser
   with html2canvas + jsPDF. Structure: state → helpers → views → rendering → events → documents. */

// ======== State, persistence and helpers ========
const $ = (s) => document.querySelector(s),
  K = "kontrola_v1",
  pad = (n) => String(n).padStart(2, "0");
const fresh = () => ({
  typ: "",
  prov: "",
  adr: "",
  datum: new Date().toLocaleDateString("sv"),
  soupis: "",
  manazer: "",
  predseda: "",
  clenove: "",
  start: "",
  end: "",
  items: [],
  hs: "",
  hf: "",
  vhot: "",
  vkon: "",
  sp: "",
  sm: "",
  tab: "home",
  fin: 0,
});
function load() {
  try {
    return JSON.parse(localStorage.getItem(K));
  } catch (e) {
    return null;
  }
}
let S = Object.assign(fresh(), load() || {}),
  tab = S.tab || "home",
  fin = S.fin || 0;
function save() {
  S.tab = tab;
  S.fin = fin;
  try {
    localStorage.setItem(K, JSON.stringify(S));
  } catch (e) {}
}
const E = (s) =>
  String(s ?? "").replace(
    /[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
  );
const fD = (i) => {
  if (!i) return "";
  const [y, m, d] = i.slice(0, 10).split("-");
  return +d + ". " + +m + ". " + y;
};
const fT = (t) => (t ? fD(t) + " " + t.slice(11, 16) : "");
const now = () => new Date().toLocaleString("sv").slice(0, 16).replace(" ", "T");
const food = () => S.typ === "food";
const tabs = () => [
  ["home", "Přehled"],
  ["prep", "Příprava"],
  ["kon", "Kontrola"],
  ["fin", "Dokončení"],
];
const finSteps = () => [
  ...(food() ? ["zap"] : []),
  "kom",
  "pds",
  ...((S.manazer || "").trim() ? ["pdm"] : []),
  "vys",
];
const N = (v) => {
  const x = parseFloat(
    String(v ?? "")
      .replace(/\s/g, "")
      .replace(",", "."),
  );
  return isNaN(x) ? null : x;
};
const diff = (it) => {

function render() {

    ([id, l]) =>
      `<button data-a="tab" data-to="${id}" class="${id === tab ? "on" : ""}">${icon(id)}<span>${l}</span></button>`,
  );

    btns.splice(
      2,

      `<button class="gap" data-a="sopen" aria-label="Přidat položky"><span class="plus">${PLUS}</span><span class="pl">Přidat</span></button>`,

  save();
}

// ======== Entry parsing and row status ========
function upd(i) {
  const it = S.items[i],
    d = diff(it),
    r = $("#r" + i);
  if (!r) return;
  $("#res" + i).textContent = d === null ? "–" : fmt(d);
  const bd = isBad(it);
  r.classList.toggle("bad", bd);
  r.classList.toggle("ok", d !== null && !bd);
  r.classList.toggle("un", d === null);
  ["d", "s"].forEach(
    (f) => ($("#v" + i + f).textContent = N(it[f]) === null ? "–" : fmt(N(it[f]))),
  );
  const t = S.items.filter((x) => N(x.s) !== null).length;
  $("#sum").textContent =
    "Vyplněno " + t + "/" + S.items.length + " · rozdíly " + S.items.filter(isBad).length;
}
/** Applies an entry ("5", "+5", "-5", "=-5") to a stored value; returns the new value, or null if invalid. */
function applyEntry(cur, raw) {
  const v = raw.trim().replace(",", ".");
  if (!v) return null;
  const x = N(v.replace(/^[+=-]/, ""));
  if (x === null) return null;
  const c = N(cur) ?? 0,
    g = v[0];
  return String(Math.round((g === "+" ? c + x : g === "-" ? c - x : x) * 1000) / 1000);
}
function commit(t) {
  const i = +t.dataset.ei,
    f = t.dataset.ef,
    r = applyEntry(S.items[i][f], t.value);
  t.value = "";
  if (r === null) return;
  S.items[i][f] = r;
  upd(i);
  save();
}

}

// ======== Import / export between devices ========
const isNum = (x) =>
  typeof x === "number" ||
  (typeof x === "string" && /^[-+]?[\d\s.,]+$/.test(x.trim()) && N(x) !== null);
/** Excel rows -> items: first text cell is the name, first number after it is the dispozice. */
function rowsToItems(rows) {
  const out = [];
  rows.forEach((r) => {
    const c = r.filter((x) => x !== "" && x != null),
      i = c.findIndex((x) => typeof x === "string" && !isNum(x));
    if (i < 0) return;
    const num = c.slice(i + 1).find(isNum);
    out.push({ n: String(c[i]).trim(), d: num === undefined ? "" : String(N(num)), s: "", k: "" });
  });
  if (out.length > 1 && out[0].d === "" && out.slice(1).some((x) => x.d !== "")) out.shift();
  return out;
}
let added = 0;
const sheetMsg = (t) => {
  $("#smsg").textContent = t;
};
function openSheet() {
  added = 0;
  sheetMsg("");

function closeSheet() {

function addManual() {
  const i = $("#sn"),
    n = i.value.trim();

  S.items.push({ n, d: "", s: "", k: "" });

function importItems(list) {
  if (!list.length) return sheetMsg("Žádné položky jsem nenašel.");
  S.items.push(...list);
  closeSheet();
  render();
}
function loadExcel(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(reader.result), { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
      importItems(rowsToItems(rows));
    } catch (e) {
      sheetMsg("Soubor se nepodařilo přečíst.");
    }
  };
  reader.readAsArrayBuffer(file);
  input.value = "";
}
// ======== Signature pad ========
function pads() {
  document.querySelectorAll("canvas.sig").forEach((c) => {
    const k = c.dataset.k,
      x = c.getContext("2d"),
      w = c.offsetWidth,
      h = c.offsetHeight;
    c.width = w * 2;
    c.height = h * 2;
    x.scale(2, 2);
    x.lineWidth = 2.2;
    x.lineCap = "round";
    x.strokeStyle = "#111";
    if (S[k]) {
      const im = new Image();
      im.onload = () => x.drawImage(im, 0, 0, w, h);
      im.src = S[k];
    }
    let dr = 0;
    const p = (e) => {
      const r = c.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    };
    c.onpointerdown = (e) => {
      dr = 1;
      c.setPointerCapture(e.pointerId);
      const [a, b] = p(e);
      x.beginPath();
      x.moveTo(a, b);
      x.lineTo(a + 0.1, b + 0.1);
      x.stroke();
    };
    c.onpointermove = (e) => {
      if (!dr) return;
      const [a, b] = p(e);
      x.lineTo(a, b);
      x.stroke();
    };
    c.onpointerup = () => {
      dr = 0;
      S[k] = c.toDataURL("image/png");
      save();
    };
  });
}

      bx("Název prodejny:", S.adr, ["left", "center"]) +

  const head = `<div style="display:flex;height:${fd ? 113 : 105}px"><div style="width:${W[0] + W[1]}px"><img src="${LOGO_X}" style="display:block;width:${fd ? 219 : 181}px;margin:-3px 0 0 27px"></div><table class="b" style="align-self:flex-start;margin-top:21px;width:${fd ? T - W[0] - W[1] : W[2] + W[3] + W[4]}px">${blk}</table></div>`;
  const n = Math.ceil(a.length / R);
  for (let p = 0; p < n; p++) {
    const rows = a
      .slice(p * R, p * R + R)
      .map((it, j) => {
        const d = diff(it);
        return `<tr><td class="n">${p * R + j + 1}</td><td style="font:${iF};font-weight:400">${E(it.n)}</td><td class="n">${fmt(N(it.d))}</td><td style="text-align:right">${fmt(N(it.s))}</td><td class="v" style="${isBad(it) ? "background:#ffd7d7" : ""}">${fmt(d)}</td><td style="font:12px Arial,sans-serif;font-weight:400;white-space:normal">${E(it.k)}</td></tr>`;
      })
      .join("");
    P.push(
      `<div class="xl" style="height:1123px">${p ? "" : head}<table style="width:${T}px">${cg}<tr style="height:${fd ? 38 : 24}px"><th></th><th>Položka</th><th>Dispozice</th><th>Skutečnost</th><th>Výsledek</th><th>Komentář</th></tr>${rows}</table>${p == n - 1 ? `<div style="display:flex;margin-top:34px">${sgz("sp", "Předseda IK (podpis)", 1)}${sgz("sm", "Manažer (podpis, razítko)", 1)}</div>` : ""}</div>`,
    );
  }
  return P;
}
function zapis() {
  const fr = (l, v) =>
      `<div class="fr"><span class="l">${l}</span><span class="v">${E(v)}</span></div>`,
    dl = (t) => {
      const l = String(t || "").split("\n");
      while (l.length < 2) l.push("");
      return l.map((x) => `<div class="dl">${E(x)}</div>`).join("");
    },
    ex = S.clenove
      .split("\n")
      .map((s) => s.trim())
      .filter(Boolean),
    mem = [];
  if (S.manazer) mem.push([S.manazer, S.sm]);
  ex.forEach((x) => mem.push([x, ""]));
  const im = (s) => (s ? `<img src="${s}" style="height:30px;vertical-align:middle">` : ""),
    rows = [
      ["Předseda: " + E(S.predseda), "Podpis: " + im(S.sp)],
      ["Členové: " + (mem[0] ? E(mem[0][0]) : ""), mem[0] ? im(mem[0][1]) : ""],
    ];
  mem.slice(1).forEach((m) => rows.push([E(m[0]), im(m[1])]));
  while (rows.length < 3) rows.push(["", ""]);
  const g = (v) =>
      `<td style="background:#d9d9d9;text-align:center;font-weight:700;font-size:13px">${v}</td>`,
    lb = (t) =>
      `<td style="width:199px;text-align:center;font-weight:700;font-size:12px;height:38px">${t}</td>`,
    dt = (l, v) =>
      `<div style="flex:1"><div class="fr" style="margin-bottom:0"><span class="l">${l}</span><span class="v">${fT(v)}</span></div><div style="font-size:11px;margin-top:2px">(datum a hodina)</div></div>`;
  return [
    `<div class="z"><div style="text-align:center"><img src="${LOGO_D}" style="width:135px"></div>
<div style="text-align:center;font:700 18.7px 'Times New Roman',Times,serif;margin:4px 0 0">Zápis o průběhu kontroly Foodservice</div><div style="border-top:2px dashed #000;margin:4px 0 6px"></div>
<p style="text-align:center;font-weight:700;text-decoration:underline;font-size:10.3px;white-space:nowrap;margin-bottom:22px">Fyzická kontrola se provádí vždy fyzickým přepočtem osobně některým z členů inventurní komise.</p>
${fr("Příkaz k provedení fyzické inventury (FI) č.:", psug())}${fr("Na provozovně (číslo stř.):", S.prov)}${fr("Adresa provozovny:", S.adr)}${fr("Store manažer:", S.manazer)}
<div style="display:flex;gap:30px;margin-bottom:6px">${dt("Počátek kontroly", S.start)}${dt("Konec kontroly", S.end)}</div>
<div class="h">1.&nbsp;&nbsp;&nbsp;INVENTURA POKLADNÍ HOTOVOSTI</div>
<table style="border-collapse:collapse;margin-bottom:14px"><tr>${lb("Stav hotovosti v systému")}${g(N(S.hs) !== null ? fmt(N(S.hs)) + " Kč" : "")}</tr><tr>${lb("Stav hotovosti fyzicky")}${g(N(S.hf) !== null ? fmt(N(S.hf)) + " Kč" : "")}</tr><tr>${lb("Rozdíl")}${g(hd())}</tr></table>
<p style="margin-bottom:6px">Vyjádření k pokladní hotovosti:</p>${dl(S.vhot)}
<div class="h">2.&nbsp;&nbsp;&nbsp;FYZICKÁ KONTROLA ZBOŽÍ</div>
${fr("Na provozovně bylo zkontrolováno zboží dle soupisu zboží č.:", S.soupis || sug())}<p style="margin-bottom:6px">Vyjádření ke kontrole:</p>${dl(S.vkon)}
<p style="margin:16px 0 0">Podepsaní členové inventurní komise a manažer provozovny prohlašují, že všechny údaje v tomto zápisu jsou správné.</p>
<div style="display:flex;margin:10px 0 16px">${sgz("sp", "Předseda IK (podpis)")}${sgz("sm", "Manažer (podpis, razítko)")}</div>
<p style="margin-bottom:4px"><b>Fyzická kontrola byla provedena touto inventurní komisí</b> (uvádějte <b>TAKÉ</b> čitelně jméno, příjmení)<b>:</b></p>
<table style="border-collapse:collapse;width:100%">${rows.map((r) => `<tr><td style="width:53%">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>`,
  ];
}
async function gen(kind) {
  const msg = $("#msg");
  msg.textContent = "Generuji…";
  if (food() && !S.end) S.end = now();
  if (kind === "z" && !S.vkM) S.vkon = auto();
  save();
  try {
    const pages = kind === "s" ? soupis() : zapis(),
      st = $("#stage"),
      { jsPDF } = window.jspdf,
      pdf = new jsPDF("p", "mm", "a4");
    for (let i = 0; i < pages.length; i++) {
      st.innerHTML = `<div class="pg">${pages[i]}</div>`;
      const c = await html2canvas(st.firstChild, { scale: 2, backgroundColor: "#fff" }),
        img = c.toDataURL("image/jpeg", 0.92),
        h = (210 * c.height) / c.width;
      if (kind === "z" && h > 297 && h <= 360) {
        if (i) pdf.addPage();
        const w = (210 * 297) / h;
        pdf.addImage(img, "JPEG", (210 - w) / 2, 0, w, 297);
      } else
        for (let y = 0; y < h - 1; y += 297) {
          if (i || y) pdf.addPage();
          pdf.addImage(img, "JPEG", 0, -y, 210, h);
        }
    }
    st.innerHTML = "";
    const fn = (kind === "s" ? "soupis_" : "zapis_") + S.prov + "_" + S.datum + ".pdf",
      dl = await window.claude?.use?.("downloads");
    if (dl) {
      await dl.save({ filename: fn, data: pdf.output("blob") });
      msg.textContent = "Hotovo.";
    } else {
      pdf.save(fn);
      msg.textContent = "Hotovo.";
    }
  } catch (e) {
    msg.textContent =
      e && e.code === "declined"
        ? "Uložení zrušeno."
        : "Chyba při generování: " + ((e && e.message) || e);
  }
}

// ======== Event handling (delegated) ========
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.k && t.tagName !== "CANVAS") {
    S[t.dataset.k] = t.value;
    if (t.dataset.k === "vkon") S.vkM = t.value.trim() ? 1 : 0;
    if (t.dataset.k === "dil" && !S.vkM) {
      S.vkon = auto();
      const v = $("[data-k=vkon]");
      if (v) v.value = S.vkon;
    }
    if (t.dataset.k === "prov" || t.dataset.k === "datum") {
      const s = $("[data-k=soupis]");
      if (s) s.placeholder = sug();
    }
    if (t.dataset.k === "hs" || t.dataset.k === "hf") $("#hd").textContent = hd();
    save();
  } else if (t.dataset.i !== undefined) {
    S.items[+t.dataset.i][t.dataset.f] = t.value;
    upd(+t.dataset.i);
    save();
  }
});
let lastE = null,
  lastC = null;
document.addEventListener("focusin", (e) => {
  if (e.target.dataset && e.target.dataset.ei !== undefined) lastE = e.target;
  if (e.target.dataset && e.target.dataset.ec !== undefined) lastC = e.target;
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.ei !== undefined) commit(e.target);
  else if (e.target.dataset.ec !== undefined) commitCash(e.target);
  else if (e.target.id === "sf") loadExcel(e.target);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "sn") {
    e.preventDefault();
    addManual();
  } else if (e.key === "Escape") closeSheet();
});
document.addEventListener("mousedown", (e) => {
  if (e.target.closest("[data-sg]")) e.preventDefault();
});
document.addEventListener("click", (e) => {
  if (e.target.id === "sheet-bg") return closeSheet();
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.new) {
    if (S.items.length && armedNew !== d.new) {
      armedNew = d.new;
      t.textContent = "Smazat rozpracované? Klepněte znovu";
      t.classList.add("ask");
      setTimeout(() => {
        armedNew = "";
        if (t.isConnected) {
          t.textContent = d.new === "food" ? "FOOD" : "TE";
          t.classList.remove("ask");
        }
      }, 4000);
      return;
    }
    S = fresh();
    S.typ = d.new;
    armedNew = "";
    fin = 0;
    go("prep");
  } else if (d.fl !== undefined) {
    setFlt(d.fl);
  } else if (d.del !== undefined) {
    S.items.splice(+d.del, 1);
    render();
  } else if (d.clr) {
    S[d.clr] = "";
    render();
  } else if (d.sg) {
    const rw = t.closest(".row"),
      q = rw
        ? lastE && rw.contains(lastE)
          ? lastE
          : rw.querySelector('[data-ef="s"]')
        : lastC && lastC.isConnected
          ? lastC
          : $('[data-ec="hf"]'),
      v = q.value.replace(/^[+=-]/, "");
    q.value = (q.value[0] === d.sg ? "" : d.sg) + v;
    q.focus();
    if (rw) lastE = q;
    else lastC = q;
  } else if (d.rst) {
    const [i, f] = d.rst.split(":");
    S.items[+i][f] = "";
    upd(+i);
    save();
  } else if (d.rstc) {
    S[d.rstc] = "";
    refreshCash(d.rstc);
    save();
  } else if (d.a === "tab") {
    go(d.to);
    if (d.flt) setFlt(d.flt);
    if (d.fs) {
      fin = Math.max(0, finSteps().indexOf(d.fs));
      render();
    }
  } else if (d.a === "fnext" || d.a === "fprev") {
    fin = Math.max(0, Math.min(finSteps().length - 1, fin + (d.a === "fnext" ? 1 : -1)));
    render();
    scrollTo(0, 0);
  } else if (d.a === "reset") resetAsk(t);
  else if (d.a === "sopen") openSheet();
  else if (d.a === "sclose") closeSheet();
  else if (d.a === "sadd") addManual();
  else if (d.a === "clr") {
    S.items = [];
    render();
  } else if (d.a === "gs") gen("s");
  else if (d.a === "gz") gen("z");
});
let armed = 0,
  armedNew = "";
function resetAsk(btn) {
  if (!armed) {
    armed = 1;
    btn.dataset.t0 = btn.textContent;
    btn.textContent = "Opravdu? Klepněte znovu.";
    setTimeout(() => {
      armed = 0;
      if (btn.isConnected) btn.textContent = btn.dataset.t0;
    }, 4000);
    return;
  }
  S = fresh();
  tab = "home";
  fin = 0;
  armed = 0;
  render();
  scrollTo(0, 0);
}
$("#lg").src = LOGO_X;
render();
</script></body></html>
